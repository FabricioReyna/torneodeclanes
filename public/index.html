<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ARQUICRAFT - El evento de construccion mas grande de DiosesMC" />
  <title>ARQUICRAFT | Torneo de Construccion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #0b0b10;
      --bg-2: #12121a;
      --surface: #181824;
      --surface-2: #202033;
      --text-main: #f4f5f7;
      --text-soft: #c8cbe0;
      --gold: #ffd24a;
      --gold-2: #f4b400;
      --arcane: #6a5cff;
      --arcane-2: #4b39ff;
      --border: #2e3152;
      --max-width: 1120px;
      --radius: 18px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(1300px 700px at 85% -15%, rgba(106, 92, 255, 0.28), transparent 60%),
        radial-gradient(900px 500px at 0% 100%, rgba(255, 210, 74, 0.12), transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 95%);
      z-index: -1;
    }

    .container {
      width: min(92%, var(--max-width));
      margin-inline: auto;
    }

    section {
      padding: 5rem 0;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 12% 10% auto;
      height: 260px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(106, 92, 255, 0.35), rgba(255, 210, 74, 0.2));
      filter: blur(60px);
      z-index: -1;
      animation: glow 4s ease-in-out infinite alternate;
    }

    .hero-content {
      max-width: 840px;
      animation: rise 800ms ease forwards;
      opacity: 0;
      transform: translateY(16px);
    }

    .title {
      font-family: "Press Start 2P", cursive;
      font-size: clamp(1.8rem, 5vw, 4rem);
      line-height: 1.2;
      letter-spacing: 1px;
      margin-bottom: 1.4rem;
      color: var(--text-main);
      text-shadow:
        0 0 12px rgba(106, 92, 255, 0.55),
        0 0 22px rgba(255, 210, 74, 0.3);
    }

    .subtitle {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: var(--text-soft);
      margin-bottom: 2rem;
      max-width: 55ch;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0.95rem 1.4rem;
      text-decoration: none;
      color: #f7f7ff;
      font-weight: 700;
      background: linear-gradient(120deg, var(--arcane), var(--arcane-2));
      box-shadow:
        0 10px 25px rgba(75, 57, 255, 0.35),
        inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px);
      box-shadow:
        0 16px 35px rgba(75, 57, 255, 0.45),
        0 0 20px rgba(106, 92, 255, 0.4);
      filter: brightness(1.08);
    }

    .panel {
      background: linear-gradient(160deg, rgba(24, 24, 36, 0.95), rgba(21, 20, 35, 0.9));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-family: "Press Start 2P", cursive;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      line-height: 1.4;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .lead {
      color: var(--text-soft);
      max-width: 75ch;
    }

    .phases-grid {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .phase-card {
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .phase-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 210, 74, 0.5);
    }

    .phase-kicker {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--gold);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .phase-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }

    .phase-size {
      color: var(--text-soft);
      font-weight: 600;
    }

    .prize-wrap {
      display: grid;
      gap: 1rem;
      align-items: center;
    }

    .prize-highlight {
      font-family: "Press Start 2P", cursive;
      font-size: clamp(1.15rem, 4vw, 2rem);
      color: var(--gold);
      text-shadow: 0 0 18px rgba(255, 210, 74, 0.45);
      line-height: 1.35;
    }

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: rgba(11, 11, 16, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .top-nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 64px;
    }

    .brand-mark {
      font-family: "Press Start 2P", cursive;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .nav-link {
      color: var(--text-soft);
      text-decoration: none;
      font-weight: 700;
      transition: color 160ms ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      color: var(--gold);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    .admin-card {
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    .admin-card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
    }

    .admin-note {
      color: var(--text-soft);
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .login-form {
      display: grid;
      gap: 0.9rem;
    }

    .input-wrap {
      display: grid;
      gap: 0.35rem;
    }

    .input-wrap label {
      font-size: 0.86rem;
      font-weight: 700;
      color: #d7d9ed;
    }

    .login-input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #323556;
      background: #10111a;
      color: var(--text-main);
      padding: 0.75rem 0.9rem;
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .login-input:focus {
      border-color: rgba(106, 92, 255, 0.85);
      box-shadow: 0 0 0 3px rgba(106, 92, 255, 0.2);
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .cta-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 0.95rem 1.4rem;
      text-decoration: none;
      font-weight: 700;
      color: var(--text-main);
      border: 1px solid rgba(255, 210, 74, 0.4);
      background: linear-gradient(130deg, rgba(255, 210, 74, 0.1), rgba(255, 210, 74, 0.06));
      transition: transform 180ms ease, filter 180ms ease;
    }

    .cta-ghost:hover,
    .cta-ghost:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .login-status {
      min-height: 1.4rem;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .ok {
      color: #79ffa5;
    }

    .error {
      color: #ff8e9a;
    }

    .admin-panel {
      display: none;
      margin-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 1rem;
      gap: 1rem;
    }

    .admin-panel.visible {
      display: grid;
    }

    .admin-subtitle {
      font-size: 0.95rem;
      color: var(--text-soft);
      margin-bottom: 0.7rem;
    }

    .clan-form {
      display: grid;
      gap: 0.8rem;
    }

    .clan-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .check-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-soft);
      font-size: 0.9rem;
    }

    .clans-list {
      display: grid;
      gap: 0.55rem;
      max-height: 300px;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .clan-item {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      background: rgba(8, 9, 14, 0.7);
    }

    .clan-meta {
      font-size: 0.84rem;
      color: var(--text-soft);
    }

    .mini-btn {
      border: 1px solid rgba(255, 142, 154, 0.45);
      color: #ffdbe0;
      background: rgba(140, 40, 55, 0.25);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-btn:hover {
      filter: brightness(1.08);
    }

    .judges-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    .judge-identity {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(10, 11, 18, 0.7);
    }

    .judge-skin {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      image-rendering: pixelated;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: #0e0f16;
    }

    .judge-meta {
      display: grid;
      gap: 0.2rem;
      color: var(--text-soft);
      font-size: 0.88rem;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.7rem;
      align-items: end;
    }

    .score-value {
      min-width: 44px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 0.6rem 0.4rem;
      border-radius: 10px;
      color: #10111a;
      background: linear-gradient(130deg, var(--gold), #ffe689);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .obs-links {
      margin-top: 0.6rem;
      padding: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(10, 11, 18, 0.7);
      display: grid;
      gap: 0.7rem;
    }

    .obs-links-title {
      font-weight: 700;
      color: #dce0ff;
      font-size: 0.9rem;
    }

    .obs-link-row {
      display: grid;
      gap: 0.5rem;
    }

    .obs-link-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .obs-link-input {
      font-size: 0.84rem;
    }

    .rank-list {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.8rem;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(8, 9, 14, 0.7);
    }

    .rank-pos {
      font-weight: 800;
      color: var(--gold);
      min-width: 60px;
    }

    .rank-score {
      font-weight: 800;
      color: #d7e6ff;
      white-space: nowrap;
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.7rem;
      font-size: 0.92rem;
    }

    .score-table th,
    .score-table td {
      text-align: left;
      padding: 0.55rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .score-table th {
      color: #dce0ff;
      font-weight: 700;
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .ranking-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 1rem;
    }

    .ranking-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      background: linear-gradient(160deg, rgba(24, 24, 36, 0.95), rgba(21, 20, 35, 0.9));
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .ranking-table th,
    .ranking-table td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem 0.8rem;
      text-align: center;
      color: var(--text-main);
    }

    .ranking-table thead th {
      background: rgba(255, 210, 74, 0.08);
      color: #fff3c6;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .ranking-table tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .ranking-table .clan-name {
      text-align: left;
      font-weight: 800;
      color: var(--text-main);
    }

    .judge-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      color: var(--gold-soft);
      text-decoration: none;
      font-weight: 700;
    }

    .judge-link img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
      image-rendering: auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
    }

    .judge-link:hover,
    .judge-link:focus-visible {
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }

    .footer {
      padding: 2.5rem 0 3rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 2.5rem;
      color: var(--text-soft);
    }

    .footer .cta {
      margin-bottom: 1rem;
    }

    .copy {
      font-size: 0.95rem;
    }

    @media (max-width: 900px) {
      section {
        padding: 4rem 0;
      }

      .phases-grid {
        grid-template-columns: 1fr;
      }

      .admin-grid {
        grid-template-columns: 1fr;
      }

      .judges-grid {
        grid-template-columns: 1fr;
      }

      .title {
        letter-spacing: 0;
      }

      .clan-form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      from {
        transform: translateY(0) scale(1);
      }
      to {
        transform: translateY(-8px) scale(1.02);
      }
    }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="Navegacion principal">
    <div class="container">
      <a class="brand-mark" href="#inicio">ARQUICRAFT</a>
      <div class="nav-links">
        <a class="nav-link" href="#inicio">Inicio</a>
        <a class="nav-link" href="/admin.html">Login</a>
      </div>
    </div>
  </nav>

  <main>
    <section id="inicio" aria-labelledby="ranking-inicial-title">
      <div class="container panel">
        <h2 class="section-title" id="ranking-inicial-title">Ranking inicial</h2>
        <p class="lead">
          Todos los clanes aparecen con puntaje inicial en 0 mientras se desarrolla la competencia.
        </p>

        <div class="ranking-table-wrap">
          <table class="ranking-table" aria-label="Tabla de puntajes del torneo en la portada">
            <thead>
              <tr>
                <th>Clan</th>
                <th>Boantek</th>
                <th>Daviale</th>
                <th>vegetta</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="landingRanking"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    async function loadLandingRanking() {
      const container = document.getElementById("landingRanking");
      if (!container) return;

      try {
        const response = await fetch("/clanes-final.json");
        if (!response.ok) throw new Error("No se pudo cargar el ranking");

        const clans = await response.json();
        const ordered = [...(Array.isArray(clans) ? clans : [])]
          .map((clan) => ({
            ...clan,
            boantek: Number(clan?.boantek ?? 0),
            daviale: Number(clan?.daviale ?? 0),
            vegettagaymer: Number(clan?.vegettagaymer ?? 0)
          }))
          .sort((a, b) => {
            const totalA = a.boantek + a.daviale + a.vegettagaymer;
            const totalB = b.boantek + b.daviale + b.vegettagaymer;
            return totalB - totalA || (a.name || "").localeCompare(b.name || "", "es");
          });

        container.innerHTML = ordered
          .map((clan) => {
            const total = clan.boantek + clan.daviale + clan.vegettagaymer;
            return `
              <tr>
                <td class="clan-name">${clan.name || "Clan"}</td>
                <td>${clan.boantek}</td>
                <td>${clan.daviale}</td>
                <td>${clan.vegettagaymer}</td>
                <td><strong>${total}</strong></td>
              </tr>
            `;
          })
          .join("");
      } catch (error) {
        container.innerHTML = `
          <tr>
            <td colspan="5" class="clan-name">No se pudo cargar el ranking inicial.</td>
          </tr>
        `;
      }
    }

    loadLandingRanking();
  </script>
</body>
</html>
